<section class="chat-layout">
                <article class="chat-box">
                    <h2>Joined Chats</h2>
                    <div class="known-chats-heading-row">
                        <button type="button" class="known-chats-create-btn" @click="openCreateChatModal">
                            Create chat
                        </button>
                    </div>
                    <ul class="chat-list">
                        <li v-if="hasNoJoinedOrPending"><em>No known chats yet.</em></li>
                        <li
                            v-for="inv of pendingInvitesDisplay"
                            :key="'pending-' + inv.channel"
                            class="chat-item chat-item-pending-invite"
                        >
                            <span class="chat-pending-title" :title="inv.title">{{ inv.title }}</span>
                            <div class="chat-pending-actions" role="group" aria-label="Invitation actions">
                                <button
                                    type="button"
                                    class="chat-pending-accept-btn"
                                    @click="acceptPendingInvite(inv)"
                                >
                                    Accept
                                </button>
                                <button
                                    type="button"
                                    class="chat-pending-decline-btn"
                                    @click="declinePendingInvite(inv)"
                                >
                                    Decline
                                </button>
                            </div>
                        </li>
                        <li
                            v-for="chat of joinedChatsList"
                            :key="chat.channel"
                            :class="{ 'chat-item-owned': isOwnedChatChannel(chat.channel) }"
                        >
                            <button type="button" @click="openKnownChat(chat)" class="chat-link">
                                {{ chat.title }}
                                <small v-if="isOwnedChatChannel(chat.channel)" class="chat-owner-tag">
                                    (Owner)
                                </small>
                                <small v-if="chat.spectator" class="chat-spectator-tag">(Spectator)</small>
                            </button>
                        </li>
                    </ul>
                </article>

                <article class="chat-box chat-box-global">
                    <h2>Public Chats</h2>
                    <ul class="chat-list">
                        <li v-if="!globalChats.length"><em>No global chats yet.</em></li>
                        <li
                            v-for="chat of globalChats"
                            :key="chat.url"
                            :class="{
                                'chat-global-item-full': isGlobalChatFull(chat),
                                'chat-item-owned': isOwnedGlobalChat(chat),
                            }"
                        >
                            <button
                                type="button"
                                @click="changeChat(chat)"
                                class="chat-link"
                                :disabled="isGlobalChatClosedToJoin(chat)"
                            >
                                <span class="chat-global-title-core">{{
                                    globalChatDisplayTitleWithSpectating(chat)
                                }}</span>
                                <span class="chat-global-meta">{{ globalChatPublicMetaSuffix(chat) }}</span>
                            </button>
                        </li>
                    </ul>
                </article>
            </section>

            <div
                v-if="showCreateChatModal"
                class="overlay-backdrop home-create-chat-backdrop"
                @click.self="closeCreateChatModal"
            >
                <section
                    class="overlay-card home-create-chat-modal"
                    role="dialog"
                    aria-modal="true"
                    aria-labelledby="home-create-chat-modal-title"
                >
                    <div class="home-create-chat-modal-head">
                        <h2 id="home-create-chat-modal-title">Create Chat</h2>
                        <button
                            type="button"
                            class="home-create-chat-modal-close"
                            aria-label="Close"
                            :disabled="isRandomizing"
                            @click="closeCreateChatModal"
                        >
                            ×
                        </button>
                    </div>
                    <form @submit.prevent="newChat()" class="stack">
                        <input type="text" v-model="chatTitle" placeholder="Chat Title" />
                        <label class="stack-label create-chat-game-label">
                            <span>Game</span>
                            <select v-model="chatGame" class="create-chat-game-select">
                                <option v-for="g in PARTYUP_GAME_OPTIONS" :key="g.value" :value="g.value">
                                    {{ g.label }}
                                </option>
                            </select>
                        </label>
                        <label
                            v-if="chatGame === 'Other'"
                            class="stack-label create-chat-game-label home-create-chat-other-game"
                        >
                            <span>New Game Name</span>
                            <input
                                type="text"
                                v-model="chatOtherGameDetail"
                                maxlength="80"
                                placeholder="Insert custom game name here"
                                autocomplete="off"
                            />
                        </label>
                        <label class="inline-field">
                            <b>Players:</b>
                            <input
                                type="number"
                                min="1"
                                :max="PARTYUP_MAX_PLAYERS"
                                v-model.number="chatPlayers"
                            />
                        </label>
                        <label class="inline-field">
                            <b>Private:</b>
                            <input type="checkbox" v-model="chatPrivacy" />
                        </label>
                        <div class="home-create-chat-modal-actions">
                            <button type="button" class="home-create-chat-cancel" @click="closeCreateChatModal">
                                Cancel
                            </button>
                            <button type="submit" :disabled="!chatTitle || isRandomizing">
                                {{ isRandomizing ? "Creating..." : "Create Chat" }}
                            </button>
                        </div>
                    </form>
                </section>
            </div>
