<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PartyUp</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap"
            rel="stylesheet"
        />
        <script type="importmap">
            {
                "imports": {
                    "vue": "https://cdn.jsdelivr.net/npm/vue@3.5.32/dist/vue.esm-browser.js",
                    "vue-router": "https://cdn.jsdelivr.net/npm/vue-router@5.0.4/dist/vue-router.esm-browser.prod.js",
                    "@graffiti-garden/implementation-local": "https://cdn.jsdelivr.net/npm/@graffiti-garden/implementation-local@1.2.0/dist/browser/index.js",
                    "@graffiti-garden/implementation-decentralized": "https://cdn.jsdelivr.net/npm/@graffiti-garden/implementation-decentralized@0.0.9/dist/browser/index.js",
                    "@graffiti-garden/wrapper-vue": "https://cdn.jsdelivr.net/npm/@graffiti-garden/wrapper-vue@1.2.2/dist/browser/plugin.mjs"
                }
            }
        </script>
        <link rel="stylesheet" href="./style.css" />
        <script src="./main.js" type="module"></script>
    </head>
    <body>
        <div id="app">Loading...</div>
        <template id="template">
            <header>
                <h1 class="header_h1">
                    <button
                        v-if="isChatRoute"
                        type="button"
                        class="header-link header-chat-title"
                        aria-label="Scroll to top of messages"
                        @click="onChatTitleClick"
                    >
                        {{ displayedChatTitle }}<span
                            v-show="displayedChatTitle !== headerTitle"
                            class="header-chat-caret"
                            aria-hidden="true"
                        ></span>
                    </button>
                    <router-link v-else :to="{ name: 'home' }" class="header-link"> PartyUp </router-link>
                </h1>
                <nav v-if="showHomeNav" class="header-home-nav" aria-label="Lobby and profile">
                    <router-link
                        class="header-home-nav-link"
                        :class="{ 'header-home-nav-link--active': $route.name === 'home' }"
                        :to="{ name: 'home' }"
                    >
                        Lobby
                    </router-link>
                    <router-link
                        class="header-home-nav-link"
                        :class="{ 'header-home-nav-link--active': $route.name === 'profile' }"
                        :to="{ name: 'profile' }"
                    >
                        Profile
                    </router-link>
                    
                </nav>
                <div class="header-actions">
                    <button v-if="!$graffitiSession.value" @click="$graffiti.login()" class="login">Log In</button>
                    <button
                        v-else-if="$graffitiSession.value"
                        @click="$graffiti.logout($graffitiSession.value)"
                        class="logout"
                    >
                        Log Out
                    </button>
                </div>
            </header>

            <main v-if="$graffitiSession.value" class="main-content" :class="mainContentClass">
                <router-view></router-view>
            </main>
            <main v-else-if="$graffitiSession.value === null" class="logged-out-main">
                <section class="logged-out-welcome" aria-labelledby="logged-out-welcome-title">
                    <h2 id="logged-out-welcome-title">Welcome to PartyUp</h2>
                    <p>
                        Find teammates, join new chats, and keep your party together across games, all in one
                        place. 
                    </p>
                    <p class="logged-out-welcome-lede">
                        Create profiles within chats for all your characters, PM 
                        other players for secret plans, and peruse your personal rulebook!
                    </p>
                    <p class="logged-out-welcome-hint">
                        <em>
                            <button type="button" class="logged-out-login-link" @click="$graffiti.login()">
                                Sign up
                            </button>
                            or
                            <button type="button" class="logged-out-login-link" @click="$graffiti.login()">
                                log in
                            </button>
                            above to get started!
                        </em>
                    </p>
                </section>
            </main>
            <main v-else>
                <p><em>Loading session...</em></p>
            </main>
        </template>
    </body>
</html>
