<section v-if="!channel" class="chat-box">
    <p><em>Invalid chat link. Go back to <router-link to="/home">Create Chat</router-link>.</em></p>
</section>

<template v-else-if="joinBlocked">
    <section class="chat-screen chat-full-screen">
        <article class="chat-box chat-full-card">
            <template v-if="joinBlockedKind === 'banned'">
                <h2>Banned from Chat</h2>
                <p>
                    You cannot join this chat while you are on the host’s ban list for this room.
                </p>
            </template>
            <template v-else>
                <h2>Chat is Full</h2>
                <p>
                    This room already has <strong>{{ participantCount }}</strong> /
                    <strong>{{ currentChatPlayers }}</strong> players. Ask the host to raise the limit in the chat
                    settings before new players can join.
                </p>
            </template>
            <div class="join-blocked-actions">
                <button type="button" class="leave-chat" @click="leaveChat()">Back to Lobby</button>
                <button type="button" class="sidebar-forget-chat" @click="forgetChatPermanently()">
                    Remove from Joined Chats
                </button>
            </div>
            <p v-if="forgetChatError" class="send-error join-blocked-error">{{ forgetChatError }}</p>
        </article>
    </section>
</template>

<template v-else>
    <section class="chat-screen">
        <button
            v-if="chatLayoutNarrow"
            type="button"
            class="chat-settings-mobile-toggle"
            :aria-expanded="chatSettingsExpanded"
            @click="chatSettingsExpanded = !chatSettingsExpanded"
        >
            <span class="chat-settings-mobile-toggle-text">
                <span class="chat-settings-mobile-toggle-title">{{
                    showSpectatorChrome ? 'Spectating' : 'Chat Info'
                }}</span>
                <span v-if="chatDisplayPrefs.showGame" class="chat-settings-mobile-toggle-game">{{
                    currentChatGame
                }}</span>
            </span>
            <span class="chat-settings-mobile-toggle-chevron" aria-hidden="true">{{
                chatSettingsExpanded ? '▼' : '▶'
            }}</span>
        </button>
        <aside
            v-if="!chatLayoutNarrow || chatSettingsExpanded"
            class="chat-settings"
            :class="{ 'chat-settings--spectator': showSpectatorChrome }"
        >
            <template v-if="showSpectatorChrome">
                <p v-if="areMessageObjectsLoading" class="sidebar-hint-small sidebar-spectator-loading-hint">
                    <em>Loading room…</em>
                </p>
                <p class="sidebar-spectator-banner">Spectator Mode</p>
                <p v-if="chatDisplayPrefs.showGame" class="sidebar-hint-small">
                    <strong>Game:</strong> {{ currentChatGame }}
                </p>
                <p v-if="chatDisplayPrefs.showMaxPlayers" class="sidebar-hint-small">
                    <strong>Players in room:</strong> {{ participantCount }} / {{ currentChatPlayers }}
                </p>
                <button
                    type="button"
                    class="sidebar-join-as-player-btn"
                    :disabled="!canJoinAsPlayerFromSpectator"
                    @click="joinChatAsPlayerFromSpectator()"
                >
                    {{ joinAsPlayerBusy ? 'Joining…' : 'Join as Player' }}
                </button>
                <p
                    v-if="participantCount >= currentChatPlayers && !joinAsPlayerBusy"
                    class="sidebar-hint-small sidebar-spectator-slot-hint"
                >
                    No open player slots. One opens when a player uses Leave Chat (removes from Joined Chats) or
                    the host kicks or bans someone.
                </p>
                <button type="button" class="leave-chat" @click="leaveChat()">Back to Lobby</button>
            </template>
            <template v-else>
            <h2 v-if="chatDisplayPrefs.showGame">Game: {{ currentChatGame }}</h2>
            <p v-if="chatDisplayPrefs.showMaxPlayers"><strong>Max Players:</strong> {{ currentChatPlayers }}</p>
            <section v-if="showSidebarInviteSection" class="sidebar-invite-section">
                <button
                    type="button"
                    id="sidebar-invite-heading"
                    class="sidebar-invite-disclosure"
                    :class="{ 'sidebar-invite-disclosure--collapsed': !inviteSectionExpanded }"
                    :aria-expanded="inviteSectionExpanded"
                    aria-controls="sidebar-invite-panel"
                    @click="toggleInviteSectionExpanded()"
                >
                    <span class="sidebar-invite-disclosure-title">Invite Users</span>
                    <span class="sidebar-invite-disclosure-chevron" aria-hidden="true">▼</span>
                </button>
                <div
                    id="sidebar-invite-panel"
                    v-show="inviteSectionExpanded"
                    class="sidebar-invite-panel"
                >
                <div class="sidebar-invite-actions-card">
                    <button type="button" class="sidebar-copy-id sidebar-invite-btn" @click="copyInviteLink()">
                        Copy invite link
                    </button>
                    <p v-if="copyChatIdStatus" class="sidebar-copy-id-status">{{ copyChatIdStatus }}</p>
                    <div class="sidebar-invite-user-block">
                        <label class="sidebar-invite-user-label" for="sidebar-invite-user-input">Invite By Name</label>
                        <div class="sidebar-invite-user-row">
                            <div ref="inviteUserSuggestRoot" class="sidebar-invite-user-input-col">
                                <div class="sidebar-invite-user-input-row">
                                    <input
                                        id="sidebar-invite-user-input"
                                        v-model="inviteUserActorInput"
                                        type="text"
                                        class="sidebar-invite-user-input"
                                        placeholder="e.g. name or name.graffiti.actor"
                                        maxlength="120"
                                        autocomplete="off"
                                        @keydown.enter.prevent="sendInvitePushToUser()"
                                    />
                                    <button
                                        type="button"
                                        class="sidebar-invite-user-suggest-toggle"
                                        :disabled="!coplayersForInviteDropdown.length"
                                        :class="{ 'sidebar-invite-user-suggest-toggle--open': showInviteUserSuggestDropdown }"
                                        :aria-expanded="showInviteUserSuggestDropdown"
                                        :aria-controls="'sidebar-invite-user-suggest-panel'"
                                        title="Pick from recent co-players (up to 5)"
                                        @click.stop="toggleInviteUserSuggestDropdown()"
                                    >
                                        <span class="sidebar-invite-user-suggest-chevron" aria-hidden="true">▼</span>
                                    </button>
                                </div>
                                <div
                                    v-show="showInviteUserSuggestDropdown && coplayersForInviteDropdown.length"
                                    id="sidebar-invite-user-suggest-panel"
                                    class="sidebar-invite-user-suggest-panel"
                                    role="listbox"
                                    aria-label="Suggested co-players"
                                >
                                    <button
                                        v-for="row in coplayersForInviteDropdown"
                                        :key="row.actorId"
                                        type="button"
                                        class="sidebar-invite-user-suggest-option"
                                        role="option"
                                        @click.stop="selectInviteUserSuggestion(row)"
                                    >
                                        <span class="sidebar-invite-user-suggest-name">{{ row.displayName }}</span>
                                        <span class="sidebar-invite-user-suggest-id">{{ formatActorIdShort(row.actorId) }}</span>
                                    </button>
                                </div>
                            </div>
                            <button
                                type="button"
                                class="sidebar-invite-user-send"
                                :disabled="!canSendInvitePush || invitePushBusy"
                                @click="sendInvitePushToUser()"
                            >
                                {{ invitePushBusy ? "Sending…" : "Send" }}
                            </button>
                        </div>
                        <p v-if="invitePushFeedback" class="sidebar-invite-user-feedback">{{ invitePushFeedback }}</p>
                    </div>
                </div>
                </div>

            </section>

            <div class="sidebar-actions-wrap">
                <div v-if="isChatCreator" class="sidebar-actions-grid">
                    <button type="button" @click="openGameOverlay()" class="sidebar_button">
                        Owner ⚙️
                    </button>
                    <button type="button" @click="openChatOverlay()" class="sidebar_button">Chat ⚙️</button>
                    <button type="button" @click="openRulebook()" class="sidebar_button">Rulebook 📜</button>
                    <button type="button" @click="openToolOverlay()" class="sidebar_button">Game Tools 🛠️</button>
                </div>
                <div v-else class="sidebar-actions-grid">
                    <button type="button" @click="openChatOverlay()" class="sidebar_button sidebar-actions-span-2">
                        Chat ⚙️
                    </button>
                    <button type="button" @click="openRulebook()" class="sidebar_button">Rulebook 📜</button>
                    <button type="button" @click="openToolOverlay()" class="sidebar_button">Game Tools 🛠️</button>
                </div>
                <button type="button" class="sidebar_button sidebar-actions-see-players" @click="togglePlayersDropdown()">
                    See Players
                </button>
            </div>
            <div v-if="showPlayersDropdown" class="players-dropdown">
                <p><strong>Players</strong></p>
                <ul class="players-dropdown-list">
                    <li v-if="!otherUsersInChat.length"><em>No other users found yet.</em></li>
                    <li v-for="user of otherUsersInChat" :key="user.actor" class="players-dropdown-item">
                        <button
                            type="button"
                            class="players-dropdown-name"
                            :class="{ 'players-dropdown-name--recent': user.isRecent }"
                            :title="
                                user.isRecent
                                    ? 'Posted recently — likely still in or near this chat'
                                    : undefined
                            "
                            @click="onPlayerClick(user)"
                        >
                            {{ user.name }}
                        </button>
                        <span v-if="isChatCreator" class="players-dropdown-moderation">
                            <button
                                type="button"
                                class="players-dropdown-kick"
                                :disabled="moderationBusyActor === user.actor"
                                @click.stop="kickPlayer(user.actor)"
                            >
                                {{
                                    moderationBusyActor === user.actor && moderationBusyKind === 'kick'
                                        ? 'Kicking…'
                                        : 'Kick'
                                }}
                            </button>
                            <button
                                type="button"
                                class="players-dropdown-ban"
                                :disabled="
                                    moderationBusyActor === user.actor ||
                                    bannedActorsEffective.includes(user.actor)
                                "
                                @click.stop="banPlayer(user.actor)"
                            >
                                {{
                                    moderationBusyActor === user.actor && moderationBusyKind === 'ban'
                                        ? 'Banning…'
                                        : 'Ban'
                                }}
                            </button>
                        </span>
                    </li>
                </ul>
                <div v-if="isChatCreator" class="players-dropdown-ban-section">
                    <p><strong>Banned Players</strong></p>
                    <ul v-if="bannedUsersDisplay.length" class="players-dropdown-list">
                        <li
                            v-for="user of bannedUsersDisplay"
                            :key="user.actor"
                            class="players-dropdown-item players-dropdown-banned-item"
                        >
                            <span class="players-dropdown-banned-name">{{ user.name }}</span>
                            <button
                                type="button"
                                class="players-dropdown-unban"
                                :disabled="moderationBusyActor === user.actor"
                                @click.stop="unbanPlayer(user.actor)"
                            >
                                {{
                                    moderationBusyActor === user.actor && moderationBusyKind === 'unban'
                                        ? 'Unbanning…'
                                        : 'Unban'
                                }}
                            </button>
                        </li>
                    </ul>
                    <p v-else class="players-dropdown-ban-empty"><em>No banned players.</em></p>
                </div>
                <p v-if="moderationError" class="send-error players-dropdown-mod-error">{{ moderationError }}</p>
            </div>
            <div class="sidebar-danger-zone">
                <template v-if="isChatCreator">
                    <button
                        type="button"
                        class="sidebar-delete-chat"
                        :disabled="isDeletingChat"
                        @click="openDeleteChatConfirm()"
                    >
                        Delete Chat
                    </button>
                    <p class="sidebar-hint-small">
                        <b>Warning</b>: This chat will be deleted for everyone permanently.
                    </p>
                </template>
                <template v-if="!isChatCreator">
                    <button type="button" class="sidebar-forget-chat" @click="forgetChatPermanently()">
                        Leave Chat
                    </button>
                    <p class="sidebar-hint-small">
                        You can rejoin again from Public Chats or with an
                        invite link.
                    </p>
                    <p v-if="forgetChatError" class="send-error">{{ forgetChatError }}</p>
                </template>
                <p v-if="deleteChatError" class="send-error">{{ deleteChatError }}</p>
            </div>
            <button type="button" class="leave-chat" @click="leaveChat()">Back to Lobby</button>
            </template>
        </aside>

        <section class="chat-window">
            <div class="chat-window-messages-header">
                <div class="message-list-jump" role="group" aria-label="Jump by day in conversation">
                    <button
                        type="button"
                        class="message-list-jump-btn"
                        title="Previous day"
                        aria-label="Jump to previous day of messages"
                        @click="jumpMessageListToOlderDay()"
                    >
                        ↑
                    </button>
                    <button
                        type="button"
                        class="message-list-jump-btn"
                        title="Next day"
                        aria-label="Jump to next day of messages"
                        @click="jumpMessageListToNewerDay()"
                    >
                        ↓
                    </button>
                </div>
            </div>
            <div
                ref="messageListEl"
                class="message-list"
                @scroll.passive="onMessageListScroll"
            >
                <p v-if="areMessageObjectsLoading">
                    <em>Loading messages...</em>
                </p>
                <ul v-else>
                    <li
                        v-for="row of messageTimelineRows"
                        :key="row.type === 'day' ? `day-${row.dayKey}` : row.object.url"
                        :data-message-url="row.type === 'message' ? row.object.url : null"
                        :class="{
                            'message-day-separator-wrap': row.type === 'day',
                            'own-message':
                                row.type === 'message' &&
                                row.object.actor === $graffitiSession.value?.actor,
                        }"
                    >
                        <template v-if="row.type === 'day'">
                            <div class="message-day-separator" role="presentation">
                                <span class="message-day-line" aria-hidden="true"></span>
                                <time class="message-day-label" :datetime="row.dayKey">{{
                                    row.label
                                }}</time>
                                <span class="message-day-line" aria-hidden="true"></span>
                            </div>
                        </template>
                        <template v-else>
                            <div class="message-cluster">
                                <div class="message-row">
                                    <UserAvatar
                                        :name="row.object.value.profileName || 'User'"
                                        :image-url="row.object.value.profileAvatar"
                                        :clickable="
                                            !showSpectatorChrome &&
                                            !areMessageObjectsLoading &&
                                            row.object.actor !== $graffitiSession.value?.actor
                                        "
                                        @click="onProfileAvatarClick(row.object)"
                                    />
                                    <div class="message-body">
                                        <strong class="message-name">
                                            {{ row.object.value.profileName || 'Unknown user' }}
                                        </strong>
                                        <button
                                            v-if="row.object.value.replyToUrl"
                                            type="button"
                                            class="message-reply-quote"
                                            @click.stop="jumpToMessageUrl(row.object.value.replyToUrl)"
                                        >
                                            <span class="message-reply-quote-author">{{
                                                row.object.value.replyToAuthorName || 'Message'
                                            }}</span>
                                            <span class="message-reply-quote-snippet">{{
                                                row.object.value.replyToPreview || '…'
                                            }}</span>
                                        </button>
                                        <p class="message-text">{{ row.object.value.content }}</p>
                                        <small v-if="row.object.value.privateToActor" class="pm-tag">
                                            Private message to {{ row.object.value.privateToNickname }}
                                        </small>
                                    </div>
                                </div>
                                <div
                                    v-if="!showSpectatorChrome && !areMessageObjectsLoading"
                                    class="message-inline-actions"
                                >
                                    <button
                                        type="button"
                                        class="message-reply-btn"
                                        @click="beginReplyTo(row.object)"
                                    >
                                        Reply
                                    </button>
                                </div>
                            </div>
                            <button
                                v-if="
                                    !showSpectatorChrome &&
                                    !areMessageObjectsLoading &&
                                    row.object.actor === $graffitiSession.value?.actor
                                "
                                type="button"
                                @click="deleteMessage(row.object)"
                                :disabled="isDeleting.has(row.object.url)"
                                class="delete_button"
                            >
                                {{ isDeleting.has(row.object.url) ? 'Deleting...' : 'Delete' }}
                            </button>
                        </template>
                    </li>
                </ul>
            </div>

            <form
                v-if="!showSpectatorChrome && !areMessageObjectsLoading"
                @submit.prevent="attemptSendMessage()"
                class="message-composer"
            >
                <div class="profile-menu-anchor">
                    <button type="button" class="profile-toggle" @click="toggleProfileMenu()">
                        <UserAvatar
                            size="small"
                            :name="activeProfile?.name || 'Me'"
                            :image-url="activeProfile?.avatar || ''"
                        />
                        <span>{{ activeProfile?.name || 'Profile' }}</span>
                    </button>
                    <div v-if="showProfileMenu" class="profile-popup">
                        <p><strong>{{currentChatName}} Profiles</strong></p>
                        <ul class="profile-list">
                            <li
                                v-for="profile of currentProfiles"
                                :key="profile.id"
                                class="profile-list-item"
                                :class="{ 'profile-list-item--editing': editingProfileId === profile.id }"
                            >
                                <button type="button" class="profile-select-btn" @click="beginEditProfile(profile.id)">
                                    <UserAvatar
                                        size="small"
                                        :name="profile.name"
                                        :image-url="profile.avatar || ''"
                                    />
                                    <span class="profile-list-name">{{ profile.name }}</span>
                                </button>
                                <button
                                    type="button"
                                    class="danger profile-remove-btn"
                                    @click.stop="removeProfile(profile.id)"
                                    :disabled="currentProfiles.length <= 1"
                                >
                                    Remove
                                </button>
                            </li>
                        </ul>
                        <div class="profile-create-form">
                            <input type="text" v-model="newProfileName" placeholder="New Profile Name" maxlength="80" />
                            <input
                                type="text"
                                v-model="newProfileAvatar"
                                placeholder="Avatar Image URL (optional)"
                            />
                            <button type="button" @click="submitProfileForm()" :disabled="!newProfileName.trim()">
                                {{ editingProfileId ? 'Edit Profile' : 'Add Profile' }}
                            </button>
                        </div>
                    </div>
                </div>
                <input
                    type="text"
                    v-model="myMessage"
                    @input="handleMessageInput()"
                    placeholder="Message"
                />
                <button
                    type="submit"
                    class="send-submit"
                    :class="{ 'is-sending': isSending }"
                    :disabled="isSending"
                >
                    <span class="send-submit-fill" aria-hidden="true"></span>
                    <span class="send-submit-label" :class="{ 'is-shaking': isSendLabelShaking }">{{
                        isSending ? 'Sending...' : 'Send'
                    }}</span>
                </button>
            </form>
            <p
                v-if="!showSpectatorChrome && !areMessageObjectsLoading && replyDraftTarget"
                class="reply-draft-indicator"
            >
                Replying to <strong>{{ replyDraftTarget.authorName }}</strong>
                <template v-if="replyDraftTarget.pmRecipient">
                    — private message to <strong>{{ replyDraftTarget.pmRecipient.nickname }}</strong>
                </template>
                .
                <button type="button" class="reply-draft-cancel" @click="cancelReplyDraft()">Cancel</button>
            </p>
            <p
                v-if="!showSpectatorChrome && !areMessageObjectsLoading && privateMessageTarget"
                class="pm-draft-indicator"
            >
                Sending privately to <strong>{{ privateMessageTarget.name }}</strong>. Remove
                <code>@[{{ privateMessageTarget.name }}]</code> to cancel.
            </p>
            <p v-if="sendError" class="send-error">{{ sendError }}</p>
        </section>
    </section>

    <div v-if="showGameOverlay && isChatCreator" class="overlay-backdrop" @click.self="closeOverlays()">
        <section class="overlay-card overlay-card-wide">
            <h3>Owner Settings</h3>
            <form class="overlay-stack" @submit.prevent="saveGameSettings()">
                <label class="stack-label">
                    Change Chat Name
                    <input
                        type="text"
                        v-model="settingsChatTitle"
                        class="overlay-text-input"
                        maxlength="80"
                        placeholder="Name shown in the header and lobby"
                        autocomplete="off"
                    />
                </label>
                <label class="stack-label">
                    Change Game
                    <select :value="settingsGame" class="overlay-select" @change="onSettingsGameSelection">
                        <option v-for="g in PARTYUP_GAME_OPTIONS" :key="g.value" :value="g.value">
                            {{ g.label }}
                        </option>
                    </select>
                </label>
                <label v-if="settingsGame === 'Other'" class="stack-label">
                    New Game Name
                    <input
                        type="text"
                        v-model="settingsOtherGameDetail"
                        class="overlay-text-input"
                        maxlength="80"
                        placeholder="Insert custom game name here"
                        autocomplete="off"
                        @blur="saveOtherGameDetailIfNeeded()"
                    />
                </label>
                <label class="stack-label">
                    Change Max Number of Players
                    <input
                        type="number"
                        :min="PARTYUP_MIN_MAX_PLAYERS"
                        :max="PARTYUP_MAX_PLAYERS"
                        v-model.number="settingsMaxPlayers"
                    />
                </label>
                <p class="overlay-hint">
                    To save, the limit must be at least
                    <strong>{{ participantCount }}</strong> (players currently in this chat).
                </p>
                <label class="overlay-checkbox-label">
                    <span>Hide invite</span>
                    <input type="checkbox" v-model="settingsInviteLocked" />
                </label>
                <label class="overlay-checkbox-label">
                    <span>Enable Spectating</span>
                    <input type="checkbox" v-model="settingsSpectatingEnabled" />
                </label>
                <fieldset class="chat-display-prefs-fieldset overlay-game-tools-settings-fieldset">
                    <legend>Game tools</legend>
                    <p class="overlay-hint chat-display-prefs-lead">
                        Choose what appears in <strong>Game Tools</strong> for everyone.
                    </p>
                    <label
                        v-for="opt in PARTYUP_GAME_TOOL_OPTIONS"
                        :key="opt.id"
                        class="overlay-checkbox-label overlay-game-tool-setting-row"
                    >
                        <input type="checkbox" :value="opt.id" v-model="settingsEnabledGameTools" />
                        <span>{{ opt.label }}</span>
                    </label>
                </fieldset>
                <p v-if="settingsSaveError" class="send-error">{{ settingsSaveError }}</p>
                <div class="overlay-actions">
                    <button type="submit">Save</button>
                    <button type="button" @click="closeOverlays()">Close</button>
                </div>
            </form>
        </section>
    </div>
    <div
        v-if="showDeleteChatConfirm"
        class="warning-pop-backdrop delete-chat-confirm-backdrop"
        @click.self="cancelDeleteChatConfirm()"
    >
        <section
            class="warning-pop-card delete-chat-confirm-card"
            role="dialog"
            aria-modal="true"
            aria-labelledby="delete-chat-confirm-title"
            @click.stop
        >
            <h3 id="delete-chat-confirm-title">Delete this chat?</h3>
            <p>
                The chat will be permanently deleted. Proceed?
            </p>
            <div class="warning-pop-actions">
                <button type="button" :disabled="isDeletingChat" @click="cancelDeleteChatConfirm()">
                    Cancel
                </button>
                <button
                    type="button"
                    class="warning-pop-proceed delete-chat-confirm-proceed"
                    :disabled="isDeletingChat"
                    @click="confirmDeleteChatAsOwner()"
                >
                    {{ isDeletingChat ? 'Deleting…' : 'Confirm' }}
                </button>
            </div>
        </section>
    </div>
    <div v-if="showGameChangeWarning" class="warning-pop-backdrop" @click.self="cancelGameSelectionChange()">
        <section class="warning-pop-card" role="dialog" aria-modal="true" aria-label="Game change warning">
            <h3>Warning</h3>
            <p>Changing the game can cause irreversible changes to the chat. Proceed?</p>
            <div class="warning-pop-actions">
                <button type="button" @click="cancelGameSelectionChange()">Cancel</button>
                <button type="button" class="warning-pop-proceed" @click="confirmGameSelectionChange()">
                    Proceed
                </button>
            </div>
        </section>
    </div>
    <div v-if="showChatOverlay" class="overlay-backdrop" @click.self="closeOverlays()">
        <section class="overlay-card overlay-card-wide">
            <h3>Chat Settings</h3>
            <fieldset class="chat-display-prefs-fieldset">
                <legend>Chat Info</legend>
                <p class="overlay-hint chat-display-prefs-lead">
                    Choose what information is visible in the chat.
                </p>
                <label class="chat-display-prefs-row overlay-chat-pref-row">
                    <input type="checkbox" v-model="chatDisplayPrefs.showGame" />
                    <span>Game name</span>
                </label>
                <label class="chat-display-prefs-row overlay-chat-pref-row">
                    <input type="checkbox" v-model="chatDisplayPrefs.showMaxPlayers" />
                    <span>Max players</span>
                </label>
                <label class="chat-display-prefs-row overlay-chat-pref-row">
                    <input type="checkbox" v-model="chatDisplayPrefs.showPlayersOnline" />
                    <span>Players online</span>
                </label>
            </fieldset>
            <fieldset class="chat-display-prefs-fieldset overlay-chat-search-fieldset">
                <legend>Search Messages</legend>
                <p class="overlay-hint chat-display-prefs-lead overlay-chat-search-hint">
                    Search messages with keywords. Add
                    <code>@[name]</code>
                    to filter by sender.
                </p>
                <div class="chat-search-input-wrap">
                    <input
                        id="chat-search-input"
                        ref="chatSearchInputEl"
                        v-model="chatSearchQuery"
                        type="search"
                        class="overlay-text-input chat-search-field"
                        placeholder="Ex. @[DM] last session"
                        autocomplete="off"
                        autocorrect="off"
                        spellcheck="false"
                        @input="onChatSearchInput"
                        @click="onChatSearchSelect"
                        @keyup="onChatSearchKeydown"
                    />
                    <ul
                        v-if="chatSearchMentionSuggestions.length"
                        class="chat-search-suggestions"
                        role="listbox"
                    >
                        <li v-for="u of chatSearchMentionSuggestions" :key="u.actor" role="option">
                            <button
                                type="button"
                                class="chat-search-suggestion-btn"
                                @mousedown.prevent="applyChatSearchUserSuggestion(u)"
                            >
                                <UserAvatar size="small" :name="u.name" :image-url="u.avatar || ''" />
                                <span>{{ u.name }}</span>
                            </button>
                        </li>
                    </ul>
                </div>
                <div v-if="chatSearchQuery.trim()" class="overlay-chat-search-results">
                    <p v-if="!chatSearchResults.length" class="overlay-chat-search-empty">
                        No messages match this search.
                    </p>
                    <ul v-else class="overlay-chat-search-result-list">
                        <li v-for="msg of chatSearchResults" :key="msg.url">
                            <button
                                type="button"
                                class="overlay-chat-search-hit"
                                @click="scrollToChatSearchResult(msg)"
                            >
                                <span class="overlay-chat-search-hit-meta">
                                    <strong>{{ msg.value.profileName || 'User' }}</strong>
                                    <span class="overlay-chat-search-hit-time">{{
                                        formatMessageSearchTime(msg.value.published)
                                    }}</span>
                                </span>
                                <span class="overlay-chat-search-hit-snippet">{{
                                    formatChatSearchSnippet(msg.value.content)
                                }}</span>
                            </button>
                        </li>
                    </ul>
                </div>
            </fieldset>
            <button type="button" @click="closeOverlays()">Close</button>
        </section>
    </div>
    <div v-if="showToolOverlay" class="overlay-backdrop" @click.self="closeOverlays()">
        <section class="overlay-card overlay-card-wide">
            <h3>Game Tools</h3>
            <fieldset class="chat-display-prefs-fieldset overlay-game-help-fieldset">
                <legend>Game Help</legend>
                <p v-if="!hasAnyGameTool" class="overlay-hint">
                    No game tools are enabled for this chat. The owner can turn them on in
                    <strong>Chat ⚙️ → Game tools</strong>.
                </p>
                <div v-if="showToolDice" class="game-help-dice-row">
                    <label class="game-help-dice-label">
                        <span class="game-help-dice-label-text">Roll a Die</span>
                        <select v-model.number="selectedDiceSides" class="overlay-select game-help-dice-select">
                            <option v-for="opt in PARTYUP_DICE_OPTIONS" :key="opt.sides" :value="opt.sides">
                                {{ opt.label }}
                            </option>
                        </select>
                    </label>
                    <button
                        type="button"
                        class="game-help-roll-btn"
                        @click="rollDiceAndPmSelf()"
                        :disabled="isRollingDice || joinBlocked"
                    >
                        {{ isRollingDice ? 'Rolling…' : 'Roll' }}
                    </button>
                </div>
                <p v-if="showToolDice" class="overlay-hint game-help-dice-hint">
                    Result is sent to you as a private message.
                </p>
                <div v-if="showToolCatan" class="game-help-catan">
                    <p class="game-help-tool-title">Your Catan Pieces</p>
                    <ul class="game-help-catan-list" role="list">
                        <li class="game-help-catan-row">
                            <span class="game-help-catan-label">Roads</span>
                            <div class="game-help-catan-stepper">
                                <button
                                    type="button"
                                    class="game-help-catan-btn"
                                    aria-label="Decrease roads"
                                    @click="adjustCatan('roads', -1)"
                                >
                                    ▼
                                </button>
                                <span class="game-help-catan-value" aria-live="polite">{{
                                    catanCountRoads
                                }}</span>
                                <button
                                    type="button"
                                    class="game-help-catan-btn"
                                    aria-label="Increase roads"
                                    @click="adjustCatan('roads', 1)"
                                >
                                    ▲
                                </button>
                            </div>
                        </li>
                        <li class="game-help-catan-row">
                            <span class="game-help-catan-label">Settlements</span>
                            <div class="game-help-catan-stepper">
                                <button
                                    type="button"
                                    class="game-help-catan-btn"
                                    aria-label="Decrease settlements"
                                    @click="adjustCatan('settlements', -1)"
                                >
                                    ▼
                                </button>
                                <span class="game-help-catan-value">{{ catanCountSettlements }}</span>
                                <button
                                    type="button"
                                    class="game-help-catan-btn"
                                    aria-label="Increase settlements"
                                    @click="adjustCatan('settlements', 1)"
                                >
                                    ▲
                                </button>
                            </div>
                        </li>
                        <li class="game-help-catan-row">
                            <span class="game-help-catan-label">Cities</span>
                            <div class="game-help-catan-stepper">
                                <button
                                    type="button"
                                    class="game-help-catan-btn"
                                    aria-label="Decrease cities"
                                    @click="adjustCatan('cities', -1)"
                                >
                                    ▼
                                </button>
                                <span class="game-help-catan-value">{{ catanCountCities }}</span>
                                <button
                                    type="button"
                                    class="game-help-catan-btn"
                                    aria-label="Increase cities"
                                    @click="adjustCatan('cities', 1)"
                                >
                                    ▲
                                </button>
                            </div>
                        </li>
                        <li class="game-help-catan-row">
                            <span class="game-help-catan-label">Victory Points</span>
                            <div class="game-help-catan-stepper">
                                <button
                                    type="button"
                                    class="game-help-catan-btn"
                                    aria-label="Decrease victory points"
                                    @click="adjustCatan('vp', -1)"
                                >
                                    ▼
                                </button>
                                <span class="game-help-catan-value">{{ catanCountVP }}</span>
                                <button
                                    type="button"
                                    class="game-help-catan-btn"
                                    aria-label="Increase victory points"
                                    @click="adjustCatan('vp', 1)"
                                >
                                    ▲
                                </button>
                            </div>
                        </li>
                    </ul>
                </div>
                <div v-if="showToolBotc" class="game-help-botc">
                    <label class="game-help-botc-select-wrap stack-label">
                        <span class="game-help-tool-title">Your role</span>
                        <select v-model="selectedBotcRoleId" class="overlay-select game-help-botc-select">
                            <option value="" disabled selected>Choose a role…</option>
                            <option v-for="r in botcRolesForSelect" :key="r.id" :value="r.id">
                                {{ r.name }}
                            </option>
                        </select>
                    </label>
                    <div v-if="selectedBotcRoleDetail" class="game-help-botc-detail">
                        <p class="game-help-botc-team">
                            <strong>Team:</strong>
                            {{ selectedBotcRoleDetail.teamLabel }}
                        </p>
                        <p class="game-help-botc-blurb">{{ selectedBotcRoleDetail.blurb }}</p>
                    </div>
                </div>
            </fieldset>
            <button type="button" @click="closeOverlays()">Close</button>
        </section>
    </div>
    <div
        v-if="showRulebookViewer"
        class="overlay-backdrop rulebook-viewer-backdrop"
        @click.self="closeRulebookViewer()"
    >
        <section class="overlay-card overlay-card-rulebook" role="dialog" aria-modal="true">
            <header class="rulebook-viewer-header">
                <h3>Rulebook — {{ rulebookMissingGame }}</h3>
                <div class="rulebook-viewer-actions">
                    <button
                        v-if="rulebookViewerUrl"
                        type="button"
                        class="rulebook-open-tab"
                        @click="openRulebookInNewTab()"
                    >
                        Open in new tab
                    </button>
                    <button type="button" class="rulebook-close" @click="closeRulebookViewer()">Close</button>
                </div>
            </header>
            <p v-if="rulebookViewerUrl" class="overlay-hint rulebook-iframe-hint">
                If the frame stays empty, the site may block embedding — use
                <strong>Open in new tab</strong>.
            </p>
            <iframe
                v-if="rulebookViewerUrl"
                class="rulebook-iframe"
                title="Game rulebook"
                referrerpolicy="no-referrer-when-downgrade"
                :src="rulebookViewerUrl"
            ></iframe>
            <div v-else class="rulebook-missing">
                <p>
                    No built-in rulebook link is mapped for
                    <strong>{{ rulebookMissingGame }}</strong>.
                    Preset games use links from
                    <code>shared/game-rulebooks.js</code>
                    — ask your host or add a URL for your custom game title there.
                </p>
                <p class="overlay-hint">
                    You can still agree on house rules in chat, or paste a PDF link in the room for everyone.
                </p>
            </div>
        </section>
    </div>
</template>
